{% extends "base.html" %}

{% block content %}

<div class="element-wrapper">
  <div class="element-box">
    <h5 class="form-header">
      Topup Requests
    </h5>
    <div class="table-responsive">
      <!--------------------
      START - Basic Table
      -------------------->
      <table class="table table-striped table-bordered">
        <thead>
            <tr>
            {% for col in columns %}
                <th>{{ col.label }}</th>
            {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for row in rows %}
            <tr>
                {% for cell in row %}
                    <td>{{ cell|safe }}</td>
                {% endfor %}
            </tr>
            {% empty %}
            <tr><td colspan="{{ columns|length }}">Нет данных.</td></tr>
            {% endfor %}
        </tbody>
      </table>
      <!--------------------
      END - Basic Table
      -------------------->
    </div>
  </div>
</div>

{% endblock %}
